name: shelfbase
description: >
  Laravel-inspired backend framework for Dart, built on Shelf.
  Fluent routing, IoC container, middleware pipeline, service providers,
  Artisan-style CLI (init / serve / make:resource), and Laravel-style
  controller-action dispatch — fully AOT-safe, no reflection.
version: 0.1.0
repository: https://github.com/MZubairNaeem/shlefbase
issue_tracker: https://github.com/MZubairNaeem/shlefbase/issues

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  shelf: ^1.4.0
  args: ^2.4.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
  http: ^1.1.0
