name: shelfbase
description: >
  A NestJS-inspired backend framework built on top of Shelf for Dart.
  Provides modular architecture, dependency injection, and a structured
  controller/routing system.
version: 0.1.0
homepage: https://github.com/yourusername/shelfbase

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  shelf: ^1.4.0
  args: ^2.4.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
  http: ^1.1.0
